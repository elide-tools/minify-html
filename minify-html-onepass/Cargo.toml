[package]
name = "minify-html-onepass"
description = "Even faster version of minify-html"
license = "MIT"
homepage = "https://github.com/wilsonzlin/minify-html"
readme = "README.md"
keywords = ["html", "compress", "minifier", "js", "css"]
categories = ["compression", "development-tools::build-utils", "web-programming"]
repository = "https://github.com/wilsonzlin/minify-html.git"
version = "0.18.1"
authors = ["Wilson Lin <code@wilsonl.in>"]
edition = "2018"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
ahash = "0.8"
aho-corasick = "1.1"
lightningcss = "1.0.0-alpha.70"
memchr = "2"
minify-html-common = { version = "0.0.3", path = "../minify-html-common" }
once_cell = "1.21"
oxc = { git = "https://github.com/elide-dev/oxc", rev = "7bc0f2f33099729f606a971191a79d1fad923a77", default-features = false, features = [
  "full",
  "isolated_declarations",
  "mangler",
  "minifier",
  "transformer",
  "codegen",
] }
